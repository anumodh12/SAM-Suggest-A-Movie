<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discover — SAM</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">
        SAM<span>.</span>
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/discover">
            Discover
        </a>

        <a href="/recommendations-page">
            Recommendations
        </a>

    </div>

</nav>


<main class="discover-page">


    <div class="discover-header">

        <p class="eyebrow">
            TELL SAM WHAT YOU LIKE
        </p>

        <h1>
            Find your
            <span>next movie.</span>
        </h1>

        <p>
            Swipe the card to tell SAM what you think.
        </p>

    </div>



    <!-- =================================================
         DISCOVER / SWIPE AREA
    ================================================== -->

    <div class="swipe-area">


        <!-- VERY LIKED -->

        <div class="swipe-label swipe-label-up">

            <span class="swipe-label-icon">
                ★
            </span>

            <span>
                VERY LIKED
            </span>

        </div>



        <!-- CARD + SIDE LABELS -->

        <div class="swipe-card-row">


            <!-- DISLIKE -->

            <div class="swipe-label swipe-label-left">

                <span class="swipe-label-arrow">
                    ←
                </span>

                <span>
                    DISLIKE
                </span>

            </div>



            <!-- MOVIE CARD -->

            <div
                id="movie-card"
                class="swipe-card"
                data-movie-id="{{ movies[0].id if movies else '' }}"
            >


                <div
                    class="movie-poster"
                    id="movie-poster"
                >

                    <div class="poster-overlay">

                        <div class="movie-rating">

                            ⭐

                            <span id="movie-rating">
                                -
                            </span>

                        </div>

                    </div>

                </div>



                <div class="movie-details">

                    <div>

                        <h2 id="movie-title">
                            Loading...
                        </h2>

                        <p
                            class="movie-meta"
                            id="movie-meta"
                        >
                            Loading movie...
                        </p>

                    </div>


                    <p
                        class="movie-description"
                        id="movie-description"
                    >
                        Loading...
                    </p>

                </div>

            </div>



            <!-- LIKE -->

            <div class="swipe-label swipe-label-right">

                <span>
                    LIKE
                </span>

                <span class="swipe-label-arrow">
                    →
                </span>

            </div>


        </div>



        <!-- NOT SEEN -->

        <div class="swipe-label swipe-label-down">

            <span>
                NOT SEEN
            </span>

            <span class="swipe-label-arrow">
                ↓
            </span>

        </div>



        <!-- =================================================
             ACTION BUTTONS
        ================================================== -->

        <div class="swipe-buttons">


            <button
                type="button"
                id="dislike-button"
                class="swipe-button dislike"
                aria-label="Dislike movie"
                title="Dislike"
            >
                ✕
            </button>



            <button
                type="button"
                id="not-seen-button"
                class="swipe-button not-seen"
                aria-label="Not seen"
                title="Not seen"
            >
                ↓
            </button>



            <button
                type="button"
                id="very-like-button"
                class="swipe-button very-like"
                aria-label="Very liked"
                title="Very liked"
            >
                ★
            </button>



            <button
                type="button"
                id="like-button"
                class="swipe-button like"
                aria-label="Like movie"
                title="Like"
            >
                ♥
            </button>


        </div>



        <p class="swipe-hint">

          
            <strong>←</strong> Dislike
            &nbsp;&nbsp;·&nbsp;&nbsp;

            <strong>↓</strong> Not Seen
            &nbsp;&nbsp;·&nbsp;&nbsp;

            <strong>↑</strong>  Very Liked
            &nbsp;&nbsp;·&nbsp;&nbsp;

            Like <strong>→</strong>

        </p>


    </div>


</main>



<!-- =====================================================
     MOVIE DATA
====================================================== -->

<script>

    const movies = {{ movies | tojson }};

    const testComplete =
        {{ test_complete | default(false) | tojson }};

</script>



<script
    src="{{ url_for('static', filename='js/swipe.js') }}"
></script>


</body>

</html>
